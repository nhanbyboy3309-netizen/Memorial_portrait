
<!DOCTYPE html>
<html lang="vi" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Memorial portrait | PHOTO MOMENTS</title>
    <link id="dynamic-favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: 'rgb(var(--brand-50) / <alpha-value>)',
                100: 'rgb(var(--brand-100) / <alpha-value>)',
                200: 'rgb(var(--brand-200) / <alpha-value>)',
                500: 'rgb(var(--brand-500) / <alpha-value>)',
                600: 'rgb(var(--brand-600) / <alpha-value>)',
                700: 'rgb(var(--brand-700) / <alpha-value>)',
              }
            },
            screens: {
              'print': {'raw': 'print'},
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --brand-50: 239 246 255;
        --brand-100: 219 234 254;
        --brand-200: 191 219 254;
        --brand-500: 59 130 246;
        --brand-600: 37 99 235;
        --brand-700: 29 78 216;
      }

      /* PROFESSIONAL SLIDER STYLE */
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        height: 24px;
        margin: 0;
        cursor: pointer;
      }

      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        border: 2px solid white;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: rgb(var(--brand-600));
        margin-top: -6.5px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        transition: transform 0.1s ease;
      }
      
      input[type=range]:active::-webkit-slider-thumb {
        transform: scale(1.2);
        background: rgb(var(--brand-500));
      }

      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 3px;
        cursor: pointer;
        background: #e2e8f0;
        border-radius: 10px;
      }
      
      .dark input[type=range]::-webkit-slider-runnable-track {
        background: #334155;
      }

      input[type=range]:focus {
        outline: none;
      }

      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      
      /* Fix for mobile browsers where 100vh includes address bar */
      html, body, #root {
        min-height: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
      }

      body {
        overflow-x: hidden;
        overflow-y: auto;
        width: 100%;
      }

      #root {
        position: relative;
      }
      
      #print-mount {
        display: none;
      }
      
      @media print {
        @page {
          size: auto; 
          margin: 0;
        }
        html, body {
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        #root {
          display: none !important;
          height: 0 !important;
          overflow: hidden !important;
        }
        #print-mount {
          display: block !important;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          z-index: 9999;
          background: white;
        }
        .sheet-page {
          page-break-after: always;
          break-after: page;
          width: 130mm;
          height: auto;
          overflow: hidden;
          position: relative;
        }
        .sheet-page:last-child {
          page-break-after: avoid;
          break-after: auto;
        }
        .sheet-page img {
          width: 100% !important;
          height: auto !important;
          display: block;
        }
      }

      /* Hide scrollbar but keep functionality */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
    "firebase/": "https://esm.sh/firebase@^12.6.0/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 text-gray-900 antialiased h-full dark:bg-gray-900 dark:text-gray-100">
    <div id="root" class="h-full"></div>
    <div id="print-mount"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
